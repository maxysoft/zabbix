name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: shellcheck
        run: shellcheck setup.sh scripts/*.sh bootstrap/*.sh config/postgres/initdb/*.sh theme/build.sh
      - name: compose config
        run: |
          mkdir -p secrets/tls
          for f in postgres_password zabbix_db_password zabbix_admin_password telegram_bot_token slack_bot_token tls/ssl.crt tls/ssl.key; do
            touch "secrets/$f"
          done
          cp .env.example .env
          docker compose config -q
      - name: Nord theme is up to date
        run: theme/build.sh && git diff --exit-code theme/nord-theme.css

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: trivy
        run: |
          status=0
          while read -r img; do
            docker run --rm -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" \
              aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
              image --image-src remote --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile /trivyignore.yaml \
              --skip-files /usr/local/bin/gosu,/usr/local/bin/timescaledb-parallel-copy,/usr/local/bin/timescaledb-tune \
              "$img" || status=1
          done < <(sed -n 's/^[[:space:]]*image:[[:space:]]*["'"'"']\{0,1\}\([^"'"'"'[:space:]]*\).*/\1/p' compose.yaml | sort -u)
          exit $status
