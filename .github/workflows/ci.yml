name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck setup.sh scripts/*.sh bootstrap/*.sh config/postgres/initdb/*.sh
      - name: compose config
        run: |
          mkdir -p secrets/tls
          for f in postgres_password zabbix_db_password zabbix_admin_password telegram_bot_token slack_bot_token tls/ssl.crt tls/ssl.key; do
            touch "secrets/$f"
          done
          cp .env.example .env
          docker compose config -q

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trivy
        run: |
          status=0
          scan() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --image-src "$1" --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile /trivyignore.yaml \
              --skip-files /usr/local/bin/gosu,/usr/local/bin/timescaledb-parallel-copy,/usr/local/bin/timescaledb-tune \
              "$2" || status=1
          }
          while read -r dir; do
            docker build -q -t "zabbix-$dir:ci" "$dir"
            scan docker "zabbix-$dir:ci"
          done < <(sed -n 's/^[[:space:]]*build:[[:space:]]*\([^[:space:]]*\).*/\1/p' compose.yaml | sort -u)
          while read -r img; do
            scan remote "$img"
          done < <(sed -n 's/^[[:space:]]*image:[[:space:]]*["'"'"']\{0,1\}\([^"'"'"'[:space:]]*\).*/\1/p' compose.yaml | sort -u)
          exit $status
